# Builds the app's code update (and the old single-file .exe) on GitHub and publishes it as a release.
# Triggered by pushing a version tag (release.cmd does this).
#
# Installed copies (build 70 on) update from Krabbz9999-FlightTracker-code.gz: just server.js, index.html and version.json,
# so there is nothing here to sign. The Windows installer, launcher and tray helper are built and signed on the
# maintainer's PC (build-installer.cmd) and published separately to the "installer" release.
#
# Krabbz9999-FlightTracker.exe is only for installs from before build 70, which update from that file.
# Remove it, and the "Build the single .exe" step, once those installs are gone.

name: Build and release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release notes live in the annotated tag

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the single .exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          # The tray icon helper (tray/Tray.cs), bundled inside the .exe; csc ships with Windows (.NET Framework 4)
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" -nologo -target:winexe -optimize+ -r:System.Web.Extensions.dll -out:build\Krabbz9999-FlightTracker-Tray.exe tray\Tray.cs
          if ($LASTEXITCODE) { throw 'Tray helper failed to compile' }
          # the build code (the commit this was built from), shown beside the build number in the app
          $v = Get-Content version.json -Raw | ConvertFrom-Json
          $v | Add-Member -NotePropertyName commit -NotePropertyValue $env:GITHUB_SHA.Substring(0, 7) -Force
          $v | ConvertTo-Json -Compress | Set-Content version.json -Encoding utf8NoBOM
          node --experimental-sea-config sea-config.json
          Copy-Item (Get-Command node).Source Krabbz9999-FlightTracker.exe
          # The copy still carries Node.js's own signature; remove it before the app is injected
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName remove /s Krabbz9999-FlightTracker.exe
          npx --yes postject@1.0.0-alpha.6 Krabbz9999-FlightTracker.exe NODE_SEA_BLOB build/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Build the code update
        shell: pwsh
        run: |
          # version.json already has the commit stamped in by the step above
          node scripts/make-code-bundle.js

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = Get-Content version.json -Raw | ConvertFrom-Json
          $notes = (git tag -l --format='%(contents)' $env:GITHUB_REF_NAME) -join "`n"
          $build = if ($v.patch) { "$($v.build).$($v.patch)" } else { "$($v.build)" }
          if (-not $notes.Trim()) { $notes = "Build $build" }
          # the code bundle is what installed copies update themselves from; the plain .exe is for installs from before build 70
          gh release create $env:GITHUB_REF_NAME dist\Krabbz9999-FlightTracker-code.gz Krabbz9999-FlightTracker.exe --title "KrabbzDev's Porch Radar $($v.version) build $build" --notes "$notes"
