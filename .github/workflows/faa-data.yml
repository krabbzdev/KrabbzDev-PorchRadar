name: FAA registry data

# Once a month, download the FAA's public aircraft registry, cut it down to what Porch Radar uses (no street addresses),
# and publish it as a small file on the "faa-data" release. The app's "Download the FAA registry" / "Update now" button
# fetches that file, so people get a ~10 MB download from GitHub instead of the FAA's 73 MB zip.
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download the FAA registry
        run: curl --fail --silent --show-error -A "KrabbzDevPorchRadar/1.0 (GitHub Actions)" -o ReleasableAircraft.zip https://registry.faa.gov/database/ReleasableAircraft.zip
      - name: Build the small index
        run: node server.js --build-faa-index ReleasableAircraft.zip faa-index.json.gz
      - name: Publish it on the faa-data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view faa-data >/dev/null 2>&1 || gh release create faa-data --prerelease --latest=false --title "FAA registry data" --notes "Rebuilt monthly by the FAA registry data workflow. Used by the app's Download the FAA registry button. Not an app release."
          gh release upload faa-data faa-index.json.gz --clobber
          gh release edit faa-data --notes "FAA registry data, built $(date -u +%F). Used by the app's Download the FAA registry button. Not an app release."
